
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dubai After School Classes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app">
    <div class="container">

      <header>
        <h1>Dubai After School Classes</h1>
      </header>

      <main>
        <h2>Available Classes</h2>

        <div class="controls">
          <input
            type="text"
            v-model="searchTerm"
            placeholder="🔍 Search by subject or location..."
            class="search-box"
          />
        </div>

        <div class="lesson-grid">
          <div
            v-for="lesson in filteredLessons"
            :key="lesson.id"
            class="lesson"
          >
            <img
              :src="lesson.image"
              :alt="lesson.subject"
              class="lesson-image"
            />

            <div class="subject-badge">
              {{ lesson.subject }}
            </div>

            <h3>{{ lesson.icon }} {{ lesson.subject }}</h3>

            <div class="rating">
              <span
                v-for="star in 5"
                :key="star"
                :class="{ filled: star <= lesson.rating }"
              >★</span>

              <span class="rating-number">
                {{ lesson.rating }} / 5
              </span>
            </div>

            <p>📍 {{ lesson.location }}</p>

            <p class="price">AED {{ lesson.price }}</p>

            <p class="spaces">
              Available Spaces: {{ lesson.spaces }}
            </p>
          </div>
        </div>
      </main>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
  <script src="app.js"></script>
</body>
</html>
